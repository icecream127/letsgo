# letsgo real robot parameters. Edit this file for ROS node and navigation tuning.
# MID-360 network settings live in the adjacent mid360_real.json (driver format).

# Based on installed nav2_bringup Humble defaults. Robot radius is provisional.
nav_adapter:
  ros__parameters:
    # Vector from IMU/livox_frame origin to robot centre, expressed in IMU axes.
    # Defaults use the sensor as the planar robot centre. Measure before driving.
    livox_to_base_xyz: [0.0, 0.0, 0.0]
    livox_to_base_yaw: 0.0
    odom_max_age: 0.5
    odom_future_tolerance: 0.1
    odom_reset_threshold: 0.1
    odom_jump_distance: 0.5
    odom_jump_speed: 3.0
    odom_jump_check_window: 1.0
    velocity_history_window: 0.2
    velocity_history_reset_gap: 0.5
    map_tf_max_age: 0.5
    scan_sync_cache_depth: 20

# Limits and timeouts of the final /cmd_vel output. Units: m/s, rad/s, s.
nav_cmd_gate:
  ros__parameters:
    max_forward_speed: 0.25
    max_reverse_speed: 0.15
    max_angular_speed: 0.6
    cmd_timeout: 0.5
    odom_timeout: 0.5
    scan_timeout: 0.5
    sensor_stamp_max_age: 0.5
    sensor_future_tolerance: 0.1
    tf_max_age: 1.5
    tf_future_tolerance: 2.0
    min_valid_scan_ranges: 10
    output_period: 0.05

pointcloud_to_laserscan:
  ros__parameters:
    target_frame: nav_scan
    transform_tolerance: 0.2
    queue_size: 20
    min_height: -0.3
    max_height: 1.0
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.00872664626
    scan_time: 0.1
    range_min: 0.8
    range_max: 12.0
    use_inf: true

# Script parameters read by run/nav_goals.py.
nav_goal_client:
  ros__parameters:
    goal_timeout: 180.0

# Startup timeout in s, also used as a reminder interval while keeping RViz open.
auto_nav:
  ros__parameters:
    startup_timeout: 120.0

# Nav2 planning and control. AMCL is only used by the AMCL launch mode.
amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom_nav
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: false
bt_navigator:
